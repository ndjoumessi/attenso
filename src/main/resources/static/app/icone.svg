  <rect width="24" height="24" rx="5.5" fill="#1b5e4b"/>
  <g fill="none" stroke="#ffffff" stroke-width="2.75" stroke-linecap="round">
    <path d="M5 7h13"/>
    <path d="M5 12h9"/>
    <path d="M5 17h5"/>
  </g>
</svg>
