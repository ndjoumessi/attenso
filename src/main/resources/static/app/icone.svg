<!-- La marque d'Attenso. La géométrie est la même que `front/src/composants/
     marque.jsx` — une garde le vérifie, parce que deux dessins qui se
     ressemblent aujourd'hui divergent demain.
     Le carré vert est ici et pas dans le composant : à l'onglet comme sur un
     écran d'accueil, la marque a besoin de son fond ; dans l'en-tête du site,
     elle prend la couleur du texte. -->
