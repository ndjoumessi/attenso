<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1b5e4b">
<title>Mon tour</title>
<link rel="manifest" href="/manifest.webmanifest">
<link rel="stylesheet" href="/app/attenso.css">
</head>
<body>
<main class="enveloppe enveloppe--etroite">
  <p class="discret" id="clinique">—</p>

  <div class="carte-suivi">
    <p class="discret" id="etiquette-rang">Personnes avant vous</p>
    <p class="rang" id="rang">—</p>
    <p class="attente" id="attente">chargement…</p>
  </div>

  <div class="message message--info" id="consigne" hidden></div>
  <div class="message message--erreur" id="erreur" hidden></div>

  <p class="discret" id="numero-ticket"></p>
  <p class="discret">
    Cette page se met à jour toute seule. Vous pouvez la garder ouverte,
    la fermer et revenir : le lien reste valable aujourd'hui.
  </p>
</main>

<script type="module">
import { appel, flux, minutes } from '/app/attenso.js';

const reference = location.pathname.split('/').filter(Boolean)[1];
const el = (id) => document.getElementById(id);

const CONSIGNES = {
  PREVENU: "C'est presque à vous — revenez à la clinique maintenant.",
  APPELE: "On vous appelle. Présentez-vous à l'accueil.",
  ABSENT: "Vous avez été appelé. Signalez-vous à l'accueil : vous repassez juste après le suivant.",
  EN_CONSULTATION: 'Vous êtes en consultation.',
  TERMINE: 'Consultation terminée. Bonne journée.',
  PARTI: 'Ce passage a été clos par la clinique.',
  ANNULE: 'Ce ticket a été annulé.',
};

/**
 * Ce que la grande carte affiche, selon l'état.
 *
 * Une file d'attente et un appel ne se racontent pas avec les mêmes mots.
 * Afficher « 2 personnes avant vous » à quelqu'un qu'on vient d'appeler est
 * faux et coûteux : sur un téléphone, c'est le grand chiffre qu'on lit en
 * premier, et le client reste assis dans sa voiture. Dès qu'il est appelé, la
 * carte montre SON numéro — celui que l'écran de la salle affiche et que l'ASV
 * annonce — et plus aucune estimation.
 */
function carte(etat) {
  switch (etat.statut) {
    case 'APPELE':
      return { etiquette: "C'est à vous", valeur: etat.numero, dessous: '', appel: true };
    case 'EN_CONSULTATION':
      return { etiquette: 'Votre numéro', valeur: etat.numero, dessous: '', appel: true };
    case 'TERMINE':
    case 'PARTI':
    case 'ANNULE':
      return { etiquette: 'Votre numéro', valeur: etat.numero, dessous: '', appel: false };
    default:
      // EN_ATTENTE, PREVENU, ABSENT : la position a un sens, et pour un
      // absent elle en a même beaucoup — elle dit où il reprend sa place.
      return {
        etiquette: 'Personnes avant vous',
        valeur: Math.max(0, etat.position - 1),
        dessous: minutes(etat.attenteMinMinutes, etat.attenteMaxMinutes),
        appel: etat.position <= 1,
      };
  }
}

async function relire() {
  try {
    const etat = await appel(`/api/suivi/${encodeURIComponent(reference)}`);
    el('clinique').textContent = etat.clinique;

    const vue = carte(etat);
    el('etiquette-rang').textContent = vue.etiquette;
    const rang = el('rang');
    rang.textContent = vue.valeur;
    rang.classList.toggle('rang--cest-a-vous', vue.appel);
    el('attente').textContent = vue.dessous;
    // Le rappel du numéro est redondant quand la carte montre déjà le numéro.
    el('numero-ticket').textContent =
      vue.etiquette === 'Personnes avant vous' ? `Votre numéro : ${etat.numero}` : '';

    const consigne = el('consigne');
    consigne.textContent = CONSIGNES[etat.statut] ?? '';
    consigne.hidden = !CONSIGNES[etat.statut];
    el('erreur').hidden = true;
  } catch (echec) {
    const erreur = el('erreur');
    erreur.textContent = echec.statut === 404
      ? "Ce lien n'est plus valable. Adressez-vous à l'accueil."
      : `${echec.message} — dernier état affiché.`;
    erreur.hidden = false;
  }
}

relire();
flux(`/api/suivi/${encodeURIComponent(reference)}/flux`, relire);
setInterval(relire, 60000);
</script>

<script>
// Enregistré ici, et pas seulement déclaré : sans cet appel le fichier sw.js
// n'est jamais installé et la coquille n'est pas mise en cache.
if ('serviceWorker' in navigator) {
  addEventListener('load', () => navigator.serviceWorker.register('/sw.js')
    .catch((echec) => console.warn('service worker non enregistré', echec)));
}
</script>
</body>
</html>
