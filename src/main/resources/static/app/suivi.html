<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1b5e4b">
<title>Mon tour</title>
<link rel="manifest" href="/manifest.webmanifest">
<link rel="stylesheet" href="/app/attenso.css">
</head>
<body>
<main class="enveloppe enveloppe--etroite">
  <p class="discret" id="clinique">—</p>

  <div class="carte-suivi">
    <p class="discret" id="etiquette-rang">Personnes avant vous</p>
    <p class="rang" id="rang">—</p>
    <p class="attente" id="attente">chargement…</p>
  </div>

  <div class="message message--info" id="consigne" hidden></div>
  <div class="message message--erreur" id="erreur" hidden></div>

  <p class="discret" id="numero-ticket"></p>
  <p class="discret">
    Cette page se met à jour toute seule. Vous pouvez la garder ouverte,
    la fermer et revenir : le lien reste valable aujourd'hui.
  </p>
</main>

<script type="module">
import { appel, flux } from '/app/attenso.js';
import { carte, consigne, rappelDuNumero } from '/app/vue-suivi.js';

const reference = location.pathname.split('/').filter(Boolean)[1];
const el = (id) => document.getElementById(id);

async function relire() {
  try {
    const etat = await appel(`/api/suivi/${encodeURIComponent(reference)}`);
    el('clinique').textContent = etat.clinique;

    const vue = carte(etat);
    el('etiquette-rang').textContent = vue.etiquette;
    const rang = el('rang');
    rang.textContent = vue.valeur;
    rang.classList.toggle('rang--cest-a-vous', vue.appel);
    el('attente').textContent = vue.dessous;
    el('numero-ticket').textContent = rappelDuNumero(etat);

    const message = el('consigne');
    message.textContent = consigne(etat.statut);
    message.hidden = !message.textContent;
    el('erreur').hidden = true;
  } catch (echec) {
    const erreur = el('erreur');
    erreur.textContent = echec.statut === 404
      ? "Ce lien n'est plus valable. Adressez-vous à l'accueil."
      : `${echec.message} — dernier état affiché.`;
    erreur.hidden = false;
  }
}

relire();
flux(`/api/suivi/${encodeURIComponent(reference)}/flux`, relire);
setInterval(relire, 60000);
</script>

<script>
// Enregistré ici, et pas seulement déclaré : sans cet appel le fichier sw.js
// n'est jamais installé et la coquille n'est pas mise en cache.
if ('serviceWorker' in navigator) {
  addEventListener('load', () => navigator.serviceWorker.register('/sw.js')
    .catch((echec) => console.warn('service worker non enregistré', echec)));
}
</script>
</body>
</html>
