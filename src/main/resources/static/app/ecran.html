<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#1b5e4b" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1b1f26" media="(prefers-color-scheme: dark)">
<title>Salle d'attente</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;600;650;700;750&family=Source+Sans+3:wght@400;600;650&display=swap">
<link rel="stylesheet" href="/app/attenso.css">
</head>
<body>
<main class="mur" aria-live="polite" aria-atomic="true">
  <p class="mur-clinique" id="clinique">—</p>
  <p class="mur-appel" id="appel">—</p>
  <p class="mur-legende" id="legende">en attente</p>
  <p class="mur-prochains" id="prochains"></p>
</main>

<script type="module">
import { appel, flux } from '/app/attenso.js';
import { appel as grandNombre, legende, prochains } from '/app/vue-ecran.js';

const slug = location.pathname.split('/').filter(Boolean)[1];
const el = (id) => document.getElementById(id);

async function relire() {
  try {
    const vue = await appel(`/api/ecran/${encodeURIComponent(slug)}`);
    el('clinique').textContent = vue.clinique;
    el('appel').textContent = grandNombre(vue);
    el('legende').textContent = legende(vue);
    el('prochains').textContent = prochains(vue);
  } catch {
    // L'écran garde son dernier affichage : un mur vide inquiète la salle plus
    // qu'un numéro de trente secondes.
  }
}

relire();
flux(`/api/ecran/${encodeURIComponent(slug)}/flux`, relire);
setInterval(relire, 20000);
</script>
</body>
</html>
