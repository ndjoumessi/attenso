spring.application.name=attenso

# --- Base ---------------------------------------------------------------
# Flyway migre en propriétaire, l'application tourne en rôle applicatif
# soumis au RLS. Voir compose.yaml.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5434/attenso}
spring.datasource.username=${DB_USER:attenso_app}
spring.datasource.password=${DB_PASSWORD:attenso_dev}

spring.flyway.url=${DB_URL:jdbc:postgresql://localhost:5434/attenso}
spring.flyway.user=${DB_OWNER:postgres}
spring.flyway.password=${DB_OWNER_PASSWORD:attenso_dev}
spring.flyway.placeholders.roleApplicatif=${DB_USER:attenso_app}
spring.flyway.placeholders.mdpRoleApplicatif=${DB_PASSWORD:attenso_dev}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# --- Attenso ------------------------------------------------------------
# Aucune valeur par défaut sur le secret : l'application refuse de démarrer
# sans lui (cf. README).
attenso.jeton.secret=${ATTENSO_JWT_SECRET:}
attenso.jeton.duree-ticket=PT2H
attenso.jeton.duree-personnel=PT12H
attenso.file.periode-tick=5000
attenso.file.tickets-max-par-numero=2
# Plafond de DÉPENSE, pas de salle d'attente : une clinique en fait quarante.
# Chaque ticket déclenche un SMS payant et l'agrégateur n'offre aucun plafond.
attenso.file.tickets-max-par-jour=200

# Un seul relais de confiance devant l'application. Sert à lire
# X-Forwarded-For depuis la droite, seul côté que le client ne contrôle pas.
attenso.reseau.derriere-proxy=${ATTENSO_DERRIERE_PROXY:false}
attenso.reseau.relais-de-confiance=1
attenso.sms.expediteur=journal
# 0,045 EUR le SMS : le tarif d'abonnement, pas celui des packs prépayés
# (0,061 EUR), cf. docs/note-canal-sms.md. Changer ici si le contrat change.
attenso.sms.cout-centimes-par-segment=4.5

# Base des liens SMS. Doit rester courte : elle est comptée dans les 160
# caractères du segment.
attenso.lien.base=${ATTENSO_BASE_URL:http://localhost:8080}

server.port=${PORT:8080}
management.endpoints.web.exposure.include=health,info

# --- Octopush -----------------------------------------------------------
# Actif seulement avec attenso.sms.expediteur=octopush. Identifiants sans
# valeur par défaut : l'application refuse de démarrer sans eux.
attenso.octopush.url=${ATTENSO_OCTOPUSH_URL:https://api.octopush.com}
attenso.octopush.login=${ATTENSO_OCTOPUSH_LOGIN:}
attenso.octopush.cle=${ATTENSO_OCTOPUSH_CLE:}
# sms_premium : routage garanti et expéditeur alphanumérique personnalisé,
# ce dont dépend l'affichage du nom de la clinique.
attenso.octopush.type=sms_premium
# alert = transactionnel : ni mention STOP, ni restriction horaire. Déclarer
# « wholesale » ferait refuser nos messages (code 121) et interdirait le
# dimanche, jour où les cliniques de garde travaillent.
attenso.octopush.purpose=alert
# Mode bac à sable de l'API : la requête est validée, rien n'est envoyé ni
# facturé. À mettre à true pour la répétition avant le pilote.
attenso.octopush.simulation=${ATTENSO_OCTOPUSH_SIMULATION:false}
attenso.octopush.delai-connexion=PT5S
attenso.octopush.delai-lecture=PT15S

# --- Vérification HLR ---------------------------------------------------
# format (défaut) = contrôle de forme seul. octopush = vérification réelle,
# ~0,005 EUR l'appel, même compte que les SMS.
attenso.hlr.verificateur=${ATTENSO_HLR:format}
# Délai court et assumé : la vérification est sur le chemin critique de
# quelqu'un debout au comptoir. Au-delà, on laisse entrer sans savoir.
attenso.hlr.delai-lecture=PT3S
attenso.hlr.cout-centimes=0.5
# Budget d'appels payants par clinique et par jour, compté sur les
# VÉRIFICATIONS et non sur les tickets : un numéro refusé ne crée pas de
# ticket. Au-delà, on rend « indéterminé » sans appeler, et le ticket part
# quand même. Réglé au-dessus du plafond de tickets pour laisser de la marge
# aux fautes de frappe.
attenso.hlr.max-par-jour=300

# --- Notifications poussées (EF-307) ------------------------------------
# Vides par défaut : sans clés VAPID, aucun abonnement n'est proposé au client
# et tout repart en SMS. Une clé mal recopiée désactive le push avec une
# erreur journalisée, elle n'empêche pas l'application de démarrer.
attenso.push.cle-publique=${ATTENSO_PUSH_CLE_PUBLIQUE:}
attenso.push.cle-privee=${ATTENSO_PUSH_CLE_PRIVEE:}
attenso.push.sujet=${ATTENSO_PUSH_SUJET:mailto:contact@attenso.fr}

# --- Supervision (EF-903) ------------------------------------------------
# Sans webhook, tout reste journalisé — exploitable par un agrégateur de
# journaux. L'alerte externe ne doit dépendre d'aucun service obligatoire.
attenso.supervision.webhook=${ATTENSO_SUPERVISION_WEBHOOK:}
attenso.supervision.sms-en-attente-max=50
attenso.supervision.tick-tolerance-max=PT5M
attenso.supervision.periode=60000

# --- Facturation et agenda (V1a, V1b) ------------------------------------
# Après la purge RGPD de 3 h 30 : deux tâches lourdes ne doivent pas se
# croiser sur la même base.
attenso.facturation.cron=${ATTENSO_CRON_FACTURATION:0 0 4 1 * *}
attenso.agenda.cron-generation=${ATTENSO_CRON_CRENEAUX:0 15 3 * * *}
# 18 h : un rappel à 8 h se perd dans la journée, un rappel à 21 h réveille.
attenso.agenda.cron-rappel=${ATTENSO_CRON_RAPPEL_RDV:0 0 18 * * *}
attenso.carnet.cron-rappel=${ATTENSO_CRON_RAPPEL_VACCIN:0 30 9 * * *}

# --- Souscription payante (Stripe) ---------------------------------------
# Vide par défaut : sans ces réglages, l'application démarre et les cliniques
# déjà installées tournent normalement — c'est la souscription EN LIGNE qui
# est fermée, et le journal de démarrage le dit.
#
# Les MONTANTS ne sont pas ici : ils vivent chez Stripe, sous ces
# identifiants de tarif. Les redoubler ferait une quatrième copie des prix du
# §13, après l'énumération Palier, la vitrine et la page d'inscription.
attenso.paiement.cle=${ATTENSO_STRIPE_CLE:}
attenso.paiement.secret-webhook=${ATTENSO_STRIPE_WEBHOOK:}
attenso.paiement.prix.comptoir=${ATTENSO_STRIPE_PRIX_COMPTOIR:}
attenso.paiement.prix.clinique=${ATTENSO_STRIPE_PRIX_CLINIQUE:}
attenso.paiement.prix.centre=${ATTENSO_STRIPE_PRIX_CENTRE:}
# 2 h 45 : après la purge RGPD, avant la génération des créneaux.
attenso.paiement.cron-fin=${ATTENSO_CRON_FIN_ABONNEMENT:0 45 2 * * *}
