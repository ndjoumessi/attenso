# Intégration continue : une seule commande, les deux suites.
#
# `./mvnw verify` lance les 107 tests du serveur ET les 32 tests des écrans,
# puis construit le jar. C'est délibérément la même commande qu'en local : une
# CI qui fait autre chose que le développeur finit par diverger de lui, et
# c'est elle qu'on croit.
name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Une poussée annule l'exécution précédente sur la même référence : inutile de
# payer deux fois pour un état qu'on vient de remplacer.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  tests:
    name: Serveur et écrans
    runs-on: ubuntu-latest
    # Les tests d'intégration démarrent un vrai PostgreSQL : si quelque chose
    # se bloque, mieux vaut un échec en 20 minutes qu'une exécution de six
    # heures.
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v7

      - name: Java 17
        uses: actions/setup-java@v6
        with:
          java-version: '17'
          distribution: temurin
          # Met en cache ~/.m2 : sans ça chaque exécution retélécharge Spring
          # Boot en entier.
          cache: maven

      # Les tests des écrans tournent avec le runner intégré de node, lancé
      # par exec-maven-plugin pendant la phase test. Sans node sur l'exécuteur,
      # la construction échouerait au moment le plus déroutant.
      - name: Node 20
        uses: actions/setup-node@v7
        with:
          node-version: '20'

      # Testcontainers démarre postgres:16-alpine. Docker est préinstallé sur
      # les exécuteurs Ubuntu ; on le vérifie explicitement pour que l'échec
      # soit lisible le jour où ça change.
      - name: Vérifier Docker
        run: docker version --format 'Docker {{.Server.Version}}'

      - name: Tests et construction
        run: ./mvnw -B --no-transfer-progress verify

      # Les rapports servent à comprendre un échec sans relancer en local.
      - name: Rapports de test
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: rapports-surefire
          path: target/surefire-reports/
          retention-days: 7
