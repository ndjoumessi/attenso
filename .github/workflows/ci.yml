# Intégration continue : une seule commande, les deux suites.
#
# `./mvnw verify` lance les 281 tests du serveur ET les 112 tests des écrans,
# puis construit le jar. C'est délibérément la même commande qu'en local : une
# CI qui fait autre chose que le développeur finit par diverger de lui, et
# c'est elle qu'on croit.
name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Une poussée annule l'exécution précédente sur la même référence : inutile de
# payer deux fois pour un état qu'on vient de remplacer.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  tests:
    name: Serveur et écrans
    runs-on: ubuntu-latest
    # Les tests d'intégration démarrent un vrai PostgreSQL : si quelque chose
    # se bloque, mieux vaut un échec en 20 minutes qu'une exécution de six
    # heures.
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v7

      - name: Java 17
        uses: actions/setup-java@v6
        with:
          java-version: '17'
          distribution: temurin
          # Met en cache ~/.m2 : sans ça chaque exécution retélécharge Spring
          # Boot en entier.
          cache: maven

      # Les tests des écrans tournent avec le runner intégré de node, lancé
      # par exec-maven-plugin pendant la phase test. Sans node sur l'exécuteur,
      # la construction échouerait au moment le plus déroutant.
      - name: Node 20
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          # Met en cache ~/.npm d'après le verrou du front.
          cache: npm
          cache-dependency-path: front/package-lock.json

      # `npm run build` est lancé par exec-maven-plugin en generate-resources,
      # et il appelle vite, qui vit dans front/node_modules. Sans cette étape
      # la construction s'arrête sur « vite: not found » : c'est arrivé sur
      # 056d84f, parce que le Dockerfile avait reçu son npm ci et pas la CI.
      # Les deux chemins de fabrication doivent installer les mêmes
      # dépendances, sinon l'un valide ce que l'autre ne sait pas construire.
      - name: Dépendances du front
        run: npm ci --no-fund --no-audit
        working-directory: front

      # Testcontainers démarre postgres:18-alpine, la même majeure que la
      # production. Docker est préinstallé sur les exécuteurs Ubuntu ; on le
      # vérifie explicitement pour que l'échec soit lisible le jour où ça change.
      - name: Vérifier Docker
        run: docker version --format 'Docker {{.Server.Version}}'

      - name: Tests et construction
        run: ./mvnw -B --no-transfer-progress verify

      # Les rapports servent à comprendre un échec sans relancer en local.
      - name: Rapports de test
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: rapports-surefire
          path: target/surefire-reports/
          retention-days: 7
